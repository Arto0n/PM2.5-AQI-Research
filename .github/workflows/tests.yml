name: Unit tests and archived results integrity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify frozen protocol, receipt and numeric article metrics
        run: python scripts/verify_release.py
      - name: Synthetic leakage and integration tests (no Kaggle data)
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python -m pytest -q -m "not slow and not requires_data"
      - name: Verify notebook is executable without the raw dataset
        run: |
          python -m pip install nbclient
          python - <<'PYNOTE'
          import nbformat
          from nbclient import NotebookClient
          notebook = nbformat.read('PM2.5_Research.ipynb', as_version=4)
          NotebookClient(notebook, timeout=120, kernel_name='python3').execute()
          print('Notebook executed: archived results verified without data or holdout refit.')
          PYNOTE
